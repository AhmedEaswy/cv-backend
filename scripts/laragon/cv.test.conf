# Laragon nginx config for cv.test — Laravel API/admin + Nuxt frontend.
#
# Install:
#   1. Copy this file to E:/laragon/etc/nginx/sites-enabled/cv.test.conf
#   2. Remove auto.cv.test.conf (or Laragon will regenerate it on restart)
#   3. Reload nginx from Laragon (Menu → Nginx → Reload)
#   4. Run the Nuxt dev server: cd frontend && pnpm dev
#
# Laravel keeps: /api, /admin, /storage, public previews (/u, /profile, /cover-letter),
# template tests (/test), locale switcher (/lang), health (/up), Sanctum, Google OAuth.
# Everything else is proxied to the Nuxt dev server on port 3000.

server {
    listen 80;
    listen 443 ssl;
    server_name cv.test *.cv.test;
    root "E:/laragon/www/cv/public";

    index index.php;

    ssl_certificate "E:/laragon/etc/ssl/laragon.crt";
    ssl_certificate_key "E:/laragon/etc/ssl/laragon.key";
    ssl_session_timeout 5m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv3:+EXP;
    ssl_prefer_server_ciphers on;

    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.ht { deny all; }

    # Agent discovery docs (Laravel) — must not fall through to Nuxt.
    location = /skill.md { try_files $uri /index.php$is_args$args; }
    location = /llms.txt { try_files $uri /index.php$is_args$args; }
    location = /openapi.json { try_files $uri /index.php$is_args$args; }
    location ^~ /.well-known/ { try_files $uri /index.php$is_args$args; }

    # Laravel-owned routes (must stay on PHP even after the Nuxt migration).
    location ~ ^/(api|admin|mcp|u/|profile/|cover-letter/|test/|lang/|up|sanctum) {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Google OAuth callbacks (Laravel API).
    location ~ ^/auth/google/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
    }

    # Public disk (CV PDFs, uploads). Must not fall through to Nuxt.
    location ^~ /storage/ {
        alias "E:/laragon/www/cv/storage/app/public/";
        access_log off;
        expires 7d;
    }

    # Static assets shipped from Laravel public/ (images, Filament builds, etc.).
    location ^~ /fonts/ {
        try_files $uri =404;
    }

    location ^~ /images/ {
        try_files $uri =404;
    }

    location ^~ /js/ {
        try_files $uri =404;
    }

    location ^~ /css/ {
        try_files $uri =404;
    }

    location ^~ /build/ {
        try_files $uri =404;
    }

    # Nuxt Vite / production hashed assets (dev server or public/_nuxt).
    location ^~ /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nuxt landing, auth, and portal UI.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
