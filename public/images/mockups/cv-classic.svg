    <rect x="100" y="484" width="120" height="22" rx="11" fill="#f3f1ec"/>
    <text x="160" y="499" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5d5867">Strategy</text>
