name: Deploy Production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 35m
          script: |
            set -euo pipefail

            export COMPOSER_ALLOW_SUPERUSER=1
            export PUPPETEER_SKIP_DOWNLOAD=1

            APP_DIR="/var/www/edgesgate_co_usr/data/www/cv.edgesgate.com"
            APP_USER="edgesgate_co_usr"
            APP_URL="${APP_URL:-https://cv.edgesgate.com}"
            NGINX_CONF="/etc/nginx/fastpanel2-available/edgesgate_co_usr/cv.edgesgate.com.conf"

            cd "$APP_DIR"

            # Preserve runtime env + uploaded media across git reset.
            if [ ! -f .env ]; then
              echo "ERROR: missing .env in $APP_DIR"
              exit 1
            fi

            echo "==> Fetching production"
            git fetch origin production
            git checkout production
            git reset --hard origin/production

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Building Laravel Vite assets (Filament / public)"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            echo "==> Building Nuxt frontend"
            # Prefer system Node 20+; fall back to nvm when available.
            if ! node -v | grep -Eq 'v(2[0-9]|[3-9][0-9])'; then
              export NVM_DIR="$HOME/.nvm"
              if [ -s "$NVM_DIR/nvm.sh" ]; then
                # shellcheck disable=SC1090
                . "$NVM_DIR/nvm.sh"
                nvm install 20 >/dev/null
                nvm use 20 >/dev/null
              fi
            fi
            node -v
            # corepack pnpm is unreliable on this VPS; install a pinned global pnpm.
            if ! command -v pnpm >/dev/null 2>&1 || ! pnpm -v | grep -Eq '^10\.'; then
              npm install -g pnpm@10
            fi
            pnpm -v

            cd frontend
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
            # Same-origin behind nginx — public API calls hit /api on this host.
            NUXT_PUBLIC_LARAVEL_URL="$APP_URL" \
            NUXT_PUBLIC_APP_NAME="${NUXT_PUBLIC_APP_NAME:-CV}" \
              pnpm build
            test -f .output/server/index.mjs
            test -d .output/public/_nuxt

            echo "==> Syncing Nuxt /_nuxt assets into Laravel public/"
            # nginx serves these as static files (location ^~ /_nuxt/) so FastPanel's
            # catch-all *.js → index.php rule cannot 500 the client bundle.
            rm -rf "$APP_DIR/public/_nuxt"
            mkdir -p "$APP_DIR/public/_nuxt"
            cp -a .output/public/_nuxt/. "$APP_DIR/public/_nuxt/"
            cd "$APP_DIR"

            echo "==> Running migrations"
            php artisan migrate --force

            echo "==> Seeding missing templates only (firstOrCreate — no deletes)"
            php artisan db:seed --class=TemplateSeeder --force
            php artisan db:seed --class=CoverLetterTemplateSeeder --force
            php artisan db:seed --class=PublicProfileTemplateSeeder --force

            echo "==> Filament & caches"
            php artisan filament:upgrade
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Fixing ownership for PHP-FPM ($APP_USER)"
            # Keep uploaded media + Laravel writable dirs owned by the pool user.
            # Do not wipe storage/app/public — only repair ownership/perms.
            chown -R "$APP_USER:$APP_USER" storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            if [ -L public/storage ] || [ -d public/storage ]; then
              chown -h "$APP_USER:$APP_USER" public/storage || true
            fi
            # Code + built assets readable; avoid leaving root-only trees that
            # break FastPanel disable_symlinks / PHP reads.
            chown -R "$APP_USER:$APP_USER" app bootstrap config database public resources routes lang
            chown "$APP_USER:$APP_USER" artisan composer.json composer.lock package.json package-lock.json vite.config.js 2>/dev/null || true
            if [ -d frontend/.output ]; then
              chown -R "$APP_USER:$APP_USER" frontend/.output
            fi
            if [ -d public/_nuxt ]; then
              chown -R "$APP_USER:$APP_USER" public/_nuxt
            fi

            echo "==> Checking nginx Nuxt proxy + /_nuxt static"
            if [ -f "$NGINX_CONF" ] && ! grep -q '127.0.0.1:3001' "$NGINX_CONF"; then
              echo "WARN: $NGINX_CONF has no Nuxt proxy on :3001 yet."
              echo "Apply scripts/deploy/nginx.cv.edgesgate.com.conf.example then: nginx -t && systemctl reload nginx"
            fi
            if [ -f "$NGINX_CONF" ] && ! grep -q 'location ^~ /_nuxt/' "$NGINX_CONF"; then
              echo "WARN: $NGINX_CONF missing location ^~ /_nuxt/ — hashed JS may 500 via FastPanel static→PHP."
              echo "Apply scripts/deploy/nginx.cv.edgesgate.com.conf.example then: nginx -t && systemctl reload nginx"
            fi

            echo "==> Restarting Nuxt (pm2)"
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: pm2 not found — install with: npm i -g pm2"
              exit 1
            fi
            pm2 startOrReload scripts/deploy/ecosystem.config.cjs --update-env
            pm2 save

            echo "==> Smoke checks"
            sleep 2
            curl -fsS --max-time 10 "http://127.0.0.1:3001/" >/dev/null
            # Soft checks against public URL (do not fail deploy on upstream CDN quirks)
            curl -fsS --max-time 15 -o /dev/null -w "landing:%{http_code}\n" "$APP_URL/" || true
            curl -fsS --max-time 15 -o /dev/null -w "api:%{http_code}\n" "$APP_URL/api/v1/shares/templates" || true
            curl -fsS --max-time 15 -o /dev/null -w "admin:%{http_code}\n" "$APP_URL/admin/login" || true
            curl -fsS --max-time 15 -o /dev/null -w "images:%{http_code}\n" "$APP_URL/images/cv-logo.png" || true
            # Prefer a real hashed chunk from disk so we catch FastPanel/PHP theft.
            NUXT_SAMPLE="$(find public/_nuxt -type f -name '*.js' | head -n 1 || true)"
            if [ -n "$NUXT_SAMPLE" ]; then
              NUXT_PATH="/_nuxt/$(basename "$NUXT_SAMPLE")"
              curl -fsS --max-time 15 -o /dev/null -w "nuxt_asset:%{http_code}\n" "$APP_URL$NUXT_PATH" || true
            fi

            echo "==> Deploy complete"
            php artisan about --only=environment
            pm2 status
