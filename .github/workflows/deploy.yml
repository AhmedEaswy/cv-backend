name: Deploy Production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR="/var/www/edgesgate_co_usr/data/www/cv.edgesgate.com"
            APP_URL="${APP_URL:-https://cv.edgesgate.com}"
            cd "$APP_DIR"

            echo "==> Fetching production"
            git fetch origin production
            git checkout production
            git reset --hard origin/production

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Building Laravel Vite assets (Filament / public)"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            echo "==> Building Nuxt frontend"
            export NVM_DIR="$HOME/.nvm"
            # Prefer nvm Node 20+ when available; fall back to system node.
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
              nvm install 20 >/dev/null
              nvm use 20 >/dev/null
            fi
            node -v
            corepack enable
            corepack prepare pnpm@latest --activate

            cd frontend
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
            NUXT_PUBLIC_LARAVEL_URL="$APP_URL" \
            NUXT_PUBLIC_APP_NAME="${NUXT_PUBLIC_APP_NAME:-CV}" \
              pnpm build
            cd "$APP_DIR"

            echo "==> Running migrations"
            php artisan migrate --force

            echo "==> Seeding missing templates"
            php artisan db:seed --class=TemplateSeeder --force
            php artisan db:seed --class=CoverLetterTemplateSeeder --force
            php artisan db:seed --class=PublicProfileTemplateSeeder --force

            echo "==> Filament & caches"
            php artisan filament:upgrade
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Restarting Nuxt (pm2)"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 startOrReload scripts/deploy/ecosystem.config.cjs --update-env
              pm2 save
            else
              echo "WARN: pm2 not found — start Nuxt manually:"
              echo "  cd $APP_DIR && node frontend/.output/server/index.mjs"
              exit 1
            fi

            echo "==> Deploy complete"
            php artisan about --only=environment
            pm2 status
